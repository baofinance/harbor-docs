<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Harbor Protocol contract architecture">
  <defs>
    <marker id="arrowArch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- Center: Minter -->
  <rect x="360" y="200" width="180" height="70" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="450" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Minter</text>
  <text x="450" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c2410c">Minter_v1</text>

  <!-- Tokens -->
  <rect x="120" y="40" width="160" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">peggedToken</text>
  <text x="200" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">MintableBurnableERC20</text>

  <rect x="620" y="40" width="160" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="700" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">leveragedToken</text>
  <text x="700" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">MintableBurnableERC20</text>

  <!-- Oracle / reserve / fee -->
  <rect x="40" y="200" width="140" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">priceOracle</text>
  <text x="110" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">Wrapped aggregator</text>

  <rect x="40" y="290" width="140" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">reservePool</text>
  <text x="110" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">ReservePool_v1</text>

  <rect x="720" y="200" width="140" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="790" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">feeReceiver</text>
  <text x="790" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">TokenDistributor</text>

  <!-- Genesis -->
  <rect x="360" y="40" width="180" height="56" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="450" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">genesis</text>
  <text x="450" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#166534">Genesis_v1</text>

  <!-- SPM -->
  <rect x="360" y="340" width="180" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="450" y="364" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">stabilityPoolManager</text>
  <text x="450" y="382" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#a16207">StabilityPoolManager_v1</text>

  <!-- Pools -->
  <rect x="200" y="440" width="170" height="56" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="285" y="464" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532d">stabilityPoolCollateral</text>
  <text x="285" y="482" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#166534">StabilityPool_v1</text>

  <rect x="530" y="440" width="170" height="56" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="615" y="464" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532d">stabilityPoolSail</text>
  <text x="615" y="482" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#166534">StabilityPool_v1</text>

  <!-- Lines (simplified) -->
  <line x1="450" y1="96" x2="450" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowArch)"/>
  <line x1="450" y1="270" x2="450" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowArch)"/>
  <line x1="360" y1="220" x2="180" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowArch)"/>
  <line x1="540" y1="228" x2="720" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowArch)"/>
  <line x1="280" y1="96" x2="380" y2="200" stroke="#64748b" stroke-width="1.25" marker-end="url(#arrowArch)"/>
  <line x1="620" y1="96" x2="520" y2="200" stroke="#64748b" stroke-width="1.25" marker-end="url(#arrowArch)"/>
  <line x1="400" y1="396" x2="300" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowArch)"/>
  <line x1="500" y1="396" x2="600" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowArch)"/>
</svg>
