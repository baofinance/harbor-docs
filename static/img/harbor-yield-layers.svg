<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Harbor Yield layers">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#ffffff"/>

  <rect x="210" y="24" width="300" height="72" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Stability Pools (live)</text>
  <text x="360" y="74" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">haTOKENS deposited | manual claims | full control</text>

  <line x1="360" y1="96" x2="360" y2="128" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>

  <rect x="210" y="132" width="300" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="360" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Auto-Compounders (support)</text>
  <text x="360" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e40af">hc shares | ERC-4626 | compound one pool</text>

  <rect x="24" y="240" width="220" height="72" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="134" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14532d">Harbor Swap (support)</text>
  <text x="134" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#166534">direct DEX + 1inch routes</text>

  <line x1="360" y1="204" x2="360" y2="236" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
